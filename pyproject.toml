[project]
name = "swe-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=1",
    "langchain-google>=0.1.1",
    "langgraph>=0.2",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "requests>=2",
    "responses>=0.25",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
